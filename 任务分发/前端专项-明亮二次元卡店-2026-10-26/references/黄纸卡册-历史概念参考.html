#starlit-cardshop-concepts .sc-product button{font:inherit;cursor:inherit;}
#starlit-cardshop-concepts .sc-top{padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:light-dark(#ffedd1,#f1dbd0);border-bottom:1px solid var(--sc-frame);}

#starlit-cardshop-concepts .sc-small{font-size:12px;color:var(--sc-muted);}
#starlit-cardshop-concepts .sc-top .sc-small{color:light-dark(#ead0bb,#d0b5ba);}
#starlit-cardshop-concepts .sc-book{margin:18px;display:grid;grid-template-columns:.85fr 1.15fr;background:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--sc-line) 8%,transparent) 4px,transparent 5px 7px),var(--sc-paper);border:1px solid var(--sc-line);border-radius:2px;box-shadow:0 6px 18px var(--sc-shadow),inset 0 0 24px color-mix(in srgb,var(--sc-line) 30%,transparent);position:relative;}
#starlit-cardshop-concepts .sc-left{padding:18px 16px 0;position:relative;min-width:0;background:radial-gradient(ellipse at 45% 40%,var(--sc-pale),transparent 70%),var(--sc-paper);border-right:1px solid var(--sc-line);}

#starlit-cardshop-concepts .sc-options{display:grid;gap:10px;margin:18px 0;}
#starlit-cardshop-concepts .sc-mode{display:flex;align-items:center;gap:12px;padding:13px 12px;background:var(--sc-paper);color:var(--sc-ink);border:1px solid var(--sc-line);border-radius:6px;text-align:left;min-width:0;position:relative;}
#starlit-cardshop-concepts .sc-mode[aria-pressed="true"]{background:var(--sc-pale);border-color:var(--sc-rose);box-shadow:inset 4px 0 var(--sc-rose);}

#starlit-cardshop-concepts .sc-mode strong{display:block;font-weight:500;letter-spacing:1px;}
#starlit-cardshop-concepts .sc-mode small{display:block;font-size:12px;color:var(--sc-muted);padding-right:12px;}

#starlit-cardshop-concepts .sc-back{background:var(--sc-paper);color:var(--sc-ink);border:1px solid var(--sc-line);border-radius:6px;padding:10px 12px;}
#starlit-cardshop-concepts .sc-status{min-height:24px;margin:10px 0 0;font-size:12px;color:var(--sc-rose);}
#starlit-cardshop-concepts .sc-bottom{padding:0 20px 14px;color:light-dark(#edd6c3,#c9b2bc);display:flex;justify-content:space-between;gap:12px;font-size:11px;flex-wrap:wrap;}

#starlit-cardshop-concepts .sc-nightstage{position:relative;isolation:isolate;min-height:558px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 87px,color-mix(in srgb,var(--sc-wood) 35%,transparent) 88px 92px),radial-gradient(ellipse at 17% 30%,light-dark(#ad8850,#6e5432),transparent 56%),linear-gradient(150deg,light-dark(#6d5b3d,#342f22),light-dark(#483827,#241d15));}
