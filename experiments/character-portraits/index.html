<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户图源 · 25 人立绘预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172129;color:#edf0e9;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1440px;margin:auto;padding:20px}header{border-bottom:1px solid #52616a}h1{font-size:24px;margin:0}p{margin:8px 0;color:#bdcbd0}a{color:#d9c385}button,select{font:inherit;color:inherit;background:#293b47;border:1px solid #5a727f;border-radius:6px;padding:8px 12px}button{cursor:pointer}button[aria-pressed=true]{border-color:#e5c780;background:#3e5047}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.comparison{display:flex;flex-wrap:wrap;gap:24px;margin:20px 0;padding:20px;background:#20303a;border:1px solid #415867;border-radius:10px}figure{margin:0}figcaption{color:#c9d3d1}.image{display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#293d48 0 25%,#344b58 0 50%) 0 0/16px 16px;border:1px solid #56717f;min-width:128px;min-height:128px}.image.light{background:#ede8dd}.image img{image-rendering:pixelated;display:block;object-fit:contain;max-width:100%}.old{opacity:.75}.metadata{overflow-wrap:anywhere;max-width:500px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.tile{padding:10px;display:flex;flex-direction:column;align-items:center;gap:5px}.tile img{width:96px;height:96px;image-rendering:pixelated}.tile small{color:#b4c9cd}#error{color:#ffb9b9}@media(max-width:600px){header,main{padding:12px}.comparison{padding:12px;gap:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:20px}}
</style></head><body>
<header><h1>新图源 · 25 人立绘与头像</h1><p>已登记的用户透明 PNG → 原生 128×224 立绘、96×96 头像。与正式游戏使用同一份资源清单。</p><a href="/frontend/index.html">返回卡店</a> · <a href="/experiments/character-art/index.html">行走与代码换装工具</a></header>
<main><div class="controls"><label>角色 <select id="character"></select></label><label>检视尺寸 <select id="zoom"><option value="1">原生 1×</option><option value="2" selected>最近邻 2×</option><option value="4">最近邻 4×</option></select></label><label><input id="background" type="checkbox">浅色背景</label><label><input id="old" type="checkbox">对照旧代码立绘</label></div>
<p id="error" role="alert"></p><section class="comparison"><figure><div class="image" id="portrait-frame"><img id="portrait" alt="新立绘"></div><figcaption>新图源 · 原生 128×224</figcaption></figure><figure><div class="image" id="avatar-frame"><img id="avatar" alt="新头像"></div><figcaption>新头像 · 原生 96×96</figcaption></figure><figure id="old-figure" class="old" hidden><div class="image"><img id="old-portrait" alt="旧代码稿"></div><figcaption>历史代码稿 · 对照保留</figcaption></figure><div class="metadata"><h2 id="name"></h2><p id="source"></p><details><summary>来源与重建参数</summary><p id="hash"></p><p id="parameters"></p></details><p>保留图源自身的姿势与裁切范围。地图行走图由独立工具维护。</p></div></section><section id="grid" class="grid" aria-label="25 人头像"></section></main>
<style>.comparison figure{max-width:100%;overflow:auto}.image img{height:auto}</style><script type="module" src="./preview.mjs"></script></body></html>
